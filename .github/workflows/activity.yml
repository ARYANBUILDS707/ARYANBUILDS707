name: Generate Profile Visuals

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout main repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate GitHub Activity Graph
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ARYANBUILDS707
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/activity-graph.svg
          options: >-
            bg_color=050816&
            color=E6F7FF&
            line=00D9FF&
            point=00AEEF&
            area_color=008CFF&
            area=true&
            hide_border=true&
            custom_title=ARYANBUILDS707%20-%20Contribution%20Activity&
            radius=8&
            height=300

      # Generate Contribution Snake
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ARYANBUILDS707
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9FF&color_dots=%23071A2B,%230B3D5C,%23087EA4,%2300AEEF,%2300D9FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%23071A2B,%230B3D5C,%23087EA4,%2300AEEF,%2300D9FF

      # Publish BOTH files to output branch
      - name: Publish profile visuals
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
